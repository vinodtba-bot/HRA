name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://hra:hra@localhost:5432/hra
      TOKEN_PEPPER: ci-token-pepper
      DOB_PEPPER: ci-dob-pepper
      SESSION_SECRET: ci-session-secret
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: hra, POSTGRES_PASSWORD: hra, POSTGRES_DB: hra }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hra" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' }
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx next build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hra-app .
  infra:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -p .
      - run: npx cdk synth -q
        env: { CDK_DEFAULT_REGION: us-east-2 }
